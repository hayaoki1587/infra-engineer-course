<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 285" role="img" aria-label="3層システムの論理構成"><style>text{font:18px sans-serif;fill:#1e334b}.t{font-size:24px;font-weight:bold}.b{fill:#e8f3ff;stroke:#40729c;stroke-width:2}.a{stroke:#2879b8;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2879b8"/></marker></defs><text x="22" y="38" class="t">論理構成：役割と通信</text><rect class="b" x="16" y="100" width="185" height="95" rx="10"/><text x="49" y="138">ブラウザ</text><text x="50" y="168">利用者端末</text><rect class="b" x="258" y="100" width="185" height="95" rx="10"/><text x="305" y="138">Web層</text><text x="306" y="168">Nginx</text><rect class="b" x="500" y="100" width="185" height="95" rx="10"/><text x="556" y="138">AP層</text><text x="542" y="168">FastAPI</text><rect class="b" x="742" y="100" width="185" height="95" rx="10"/><text x="800" y="138">DB層</text><text x="775" y="168">PostgreSQL</text><path class="a" d="M201 146H258M443 146H500M685 146H742"/><text x="208" y="88">HTTPS</text><text x="457" y="88">HTTP</text><text x="700" y="88">SQL</text><text x="20" y="249">矢印は主な要求方向。応答は逆方向。物理サーバの台数は表さない。</text></svg>