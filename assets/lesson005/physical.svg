<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" role="img" aria-label="物理ホストと共有障害ドメインの例"><style>text{font:17px sans-serif;fill:#1e334b}.t{font-size:23px;font-weight:bold}.h{fill:#fff1dd;stroke:#a16e26;stroke-width:2}.v{fill:#e8f3ff;stroke:#487fa9;stroke-width:2}.s{fill:#f0eaf9;stroke:#8168a8;stroke-width:2}</style><text x="20" y="35" class="t">物理構成：どこを共有しているか</text><rect class="h" x="25" y="60" width="410" height="210" rx="13"/><text x="46" y="88">物理ホストA（共通障害ドメイン）</text><rect class="v" x="48" y="112" width="111" height="100" rx="8"/><text x="73" y="147">Web</text><text x="60" y="180">コンテナ</text><rect class="v" x="175" y="112" width="111" height="100" rx="8"/><text x="211" y="147">AP</text><text x="187" y="180">コンテナ</text><rect class="v" x="302" y="112" width="111" height="100" rx="8"/><text x="340" y="147">DB</text><text x="315" y="180">コンテナ</text><rect class="h" x="505" y="60" width="410" height="210" rx="13"/><text x="526" y="88">分離配置の例</text><rect class="v" x="528" y="112" width="111" height="100" rx="8"/><text x="565" y="147">Web</text><text x="540" y="180">ホスト1</text><rect class="v" x="655" y="112" width="111" height="100" rx="8"/><text x="693" y="147">AP</text><text x="667" y="180">ホスト2</text><rect class="v" x="782" y="112" width="111" height="100" rx="8"/><text x="820" y="147">DB</text><text x="794" y="180">ホスト3</text><rect class="s" x="535" y="236" width="348" height="25" rx="7"/><text x="555" y="254" style="font-size:14px">共通スイッチ・ストレージが残る場合もある</text><text x="25" y="313">左：1台の故障で全層停止。右：ホストを分けても共有資源を要確認。</text></svg>