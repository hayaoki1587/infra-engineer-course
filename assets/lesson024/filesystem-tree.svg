<svg xmlns="http://www.w3.org/2000/svg" width="850" height="490" viewBox="0 0 850 490" role="img" aria-labelledby="t d"><title id="t">Linuxのディレクトリ構造</title><desc id="d">ルートからetc、var、home、dataへ枝分かれし、etcにはnginx.conf、varにはerror.logがある概念図</desc><rect width="850" height="490" rx="16" fill="#f8fafc"/><g font-family="sans-serif" font-size="18" fill="#172554" text-anchor="middle"><rect x="360" y="22" width="130" height="52" rx="10" fill="#bfdbfe" stroke="#2563eb"/><text x="425" y="55" font-weight="bold">/</text><path d="M425 74 V110 M135 110 H715 M135 110 V143 M330 110 V143 M525 110 V143 M715 110 V143" stroke="#64748b" stroke-width="3" fill="none"/><rect x="55" y="143" width="160" height="50" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="135" y="175">etc（設定）</text><rect x="250" y="143" width="160" height="50" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="330" y="175">var（変化する）</text><rect x="445" y="143" width="160" height="50" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="525" y="175">home（利用者）</text><rect x="635" y="143" width="160" height="50" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="715" y="175">data（例）</text><path d="M135 193 V242 M330 193 V242 M525 193 V242 M715 193 V242" stroke="#64748b" stroke-width="3"/><rect x="55" y="242" width="160" height="48" rx="8" fill="#e2e8f0"/><text x="135" y="273">nginx/</text><rect x="250" y="242" width="160" height="48" rx="8" fill="#e2e8f0"/><text x="330" y="273">log/nginx/</text><rect x="445" y="242" width="160" height="48" rx="8" fill="#e2e8f0"/><text x="525" y="273">student/</text><rect x="635" y="242" width="160" height="48" rx="8" fill="#e2e8f0"/><text x="715" y="273">db/</text><path d="M135 290 V339 M330 290 V339" stroke="#64748b" stroke-width="3"/><rect x="35" y="339" width="200" height="52" rx="8" fill="#bbf7d0" stroke="#16a34a"/><text x="135" y="371">nginx.conf</text><rect x="230" y="339" width="200" height="52" rx="8" fill="#bbf7d0" stroke="#16a34a"/><text x="330" y="371">error.log</text><text x="425" y="446" font-size="15" fill="#475569">青：ディレクトリ　緑：ファイル　線：親子関係（通信経路ではない）</text></g></svg>