<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400"><rect width="900" height="400" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#17334a;font-size:19px}</style><text x="450" y="30" text-anchor="middle">ファイル読込の処理順</text><rect x="25" y="55" width="400" height="290" rx="10" fill="#dceafa" stroke="#6885a3"/><rect x="475" y="55" width="400" height="290" rx="10" fill="#e1f2e4" stroke="#6b9b75"/><text x="225" y="90" text-anchor="middle">ユーザー空間：FastAPI</text><text x="675" y="90" text-anchor="middle">カーネル空間</text><text x="50" y="145">① ファイルを開きたい</text><text x="50" y="185">② openat等を依頼</text><text x="500" y="235">③ 権限・場所・キャッシュ</text><text x="500" y="280">④ 必要ならSSDへI/O</text><text x="50" y="305">⑤ 結果を受けて内容を解釈</text><path d="M330 195h170m-10 -7l10 7 -10 7M500 315H330m10 -7l-10 7 10 7" fill="none" stroke="#397db4" stroke-width="3"/><text x="450" y="382" text-anchor="middle" font-size="16">右向き＝要求、左向き＝結果。実際の内部処理は簡略化</text></svg>