<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360"><rect width="900" height="360" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#193b52;font-size:20px}</style><text x="450" y="30" text-anchor="middle">プロセスとスレッド：メモリ共有の違い</text><rect x="25" y="55" width="410" height="255" rx="10" fill="#e7eef8" stroke="#6c8bad"/><text x="230" y="85" text-anchor="middle">別プロセス</text><rect x="45" y="110" width="175" height="155" rx="8" fill="#fff" stroke="#6c8bad"/><rect x="240" y="110" width="175" height="155" rx="8" fill="#fff" stroke="#6c8bad"/><text x="132" y="145" text-anchor="middle">プロセスA</text><text x="327" y="145" text-anchor="middle">プロセスB</text><text x="132" y="195" text-anchor="middle">独立メモリ</text><text x="327" y="195" text-anchor="middle">独立メモリ</text><text x="132" y="235" text-anchor="middle">スレッドA</text><text x="327" y="235" text-anchor="middle">スレッドB</text><rect x="465" y="55" width="410" height="255" rx="10" fill="#e7eef8" stroke="#6c8bad"/><text x="670" y="85" text-anchor="middle">一つのプロセス</text><rect x="490" y="110" width="360" height="70" rx="8" fill="#d8eddd"/><text x="670" y="150" text-anchor="middle">共有メモリ</text><rect x="490" y="210" width="160" height="55" rx="8" fill="#fff" stroke="#6c8bad"/><rect x="690" y="210" width="160" height="55" rx="8" fill="#fff" stroke="#6c8bad"/><text x="570" y="245" text-anchor="middle">スレッド1</text><text x="770" y="245" text-anchor="middle">スレッド2</text><path d="M570 210v-30M770 210v-30" stroke="#357fae" stroke-width="3"/><text x="450" y="343" text-anchor="middle" font-size="16">共有メモリの同時更新には同期が必要</text></svg>