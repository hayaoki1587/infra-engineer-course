<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 315" role="img" aria-label="移行前確認からデータ同期切替検証完了判定と切戻しへの分岐"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3779aa"/></marker></defs><style>text{font:18px sans-serif;fill:#203247}.t{font-size:24px;font-weight:bold}.b{fill:#e8f3ff;stroke:#4278a4;stroke-width:2}.d{fill:#fff1d9;stroke:#b47d2b;stroke-width:2}.line{fill:none;stroke:#3779aa;stroke-width:3;marker-end:url(#a)}</style><text class="t" x="16" y="36">移行の手順とGo/No-Go判定（例）</text><rect class="b" x="15" y="85" width="162" height="68" rx="8"/><text x="96" y="124" text-anchor="middle" font-size="18">事前確認</text><path class="line" d="M177 119H195"/><rect class="b" x="195" y="85" width="162" height="68" rx="8"/><text x="276" y="124" text-anchor="middle" font-size="18">データ同期</text><path class="line" d="M357 119H375"/><rect class="b" x="375" y="85" width="162" height="68" rx="8"/><text x="456" y="124" text-anchor="middle" font-size="16">更新停止・差分</text><path class="line" d="M537 119H555"/><rect class="b" x="555" y="85" width="162" height="68" rx="8"/><text x="636" y="124" text-anchor="middle" font-size="18">接続先切替</text><path class="line" d="M717 119H735"/><rect class="b" x="735" y="85" width="162" height="68" rx="8"/><text x="816" y="124" text-anchor="middle" font-size="16">疎通・業務確認</text><path class="line" d="M897 119H922"/><polygon class="d" points="1011,73 1099,119 1011,165 923,119"/><text x="1011" y="124" text-anchor="middle" font-size="17">判定</text><path class="line" d="M1011 165V219H853"/><text x="930" y="207" font-size="15">No-Go</text><rect class="d" x="610" y="219" width="244" height="63" rx="8"/><text x="732" y="244" text-anchor="middle" font-size="17">切戻し条件・更新差分を</text><text x="732" y="266" text-anchor="middle" font-size="17">確認して対応</text><text x="1011" y="61" text-anchor="middle" font-size="16">Go→完了</text></svg>