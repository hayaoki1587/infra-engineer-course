<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="Web AP DBの3層論理構成"><style>text{font:18px sans-serif;fill:#192b3c}.h{font-weight:bold;font-size:23px}.s{font-size:15px}.b{fill:#eaf2ff;stroke:#426aa5;stroke-width:2}.a{fill:none;stroke:#2474bc;stroke-width:3;marker-end:url(#p)}.r{fill:none;stroke:#7b8794;stroke-width:2;marker-end:url(#q)}</style><defs><marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#2474bc"/></marker><marker id="q" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#7b8794"/></marker></defs><text x="25" y="35" class="h">3層の論理構成：要求と応答</text><g><rect class="b" x="20" y="80" width="180" height="105" rx="12"/><text x="63" y="118">ブラウザ</text><text x="48" y="148" class="s">利用者・画面表示</text><rect class="b" x="245" y="80" width="180" height="105" rx="12"/><text x="310" y="118">Web</text><text x="266" y="148" class="s">Nginx・HTTP受付</text><rect class="b" x="470" y="80" width="180" height="105" rx="12"/><text x="538" y="118">AP</text><text x="493" y="148" class="s">FastAPI・業務処理</text><rect class="b" x="695" y="80" width="180" height="105" rx="12"/><text x="762" y="118">DB</text><text x="711" y="148" class="s">PostgreSQL・永続化</text></g><path class="a" d="M200 113H245M425 113H470M650 113H695"/><path class="r" d="M245 158H200M470 158H425M695 158H650"/><text x="22" y="232" class="s">青：要求（HTTP、HTTP、SQL）／灰：応答（SQL結果、HTTP応答）</text><text x="22" y="261" class="s">これは役割の図。物理サーバの台数を表さない。DBへの直接公開は想定しない。</text></svg>