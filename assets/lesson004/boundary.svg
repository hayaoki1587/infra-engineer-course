<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-label="外部連携の送信から業務反映までの境界"><style>text{font:17px sans-serif;fill:#203047}.t{font-size:22px;font-weight:bold}.b{fill:#eaf4ff;stroke:#49779f;stroke-width:2}.a{stroke:#2474bc;stroke-width:2;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2474bc"/></marker></defs><text x="20" y="36" class="t">「送信成功」と「取込成功」は別</text><g><rect class="b" x="12" y="86" width="158" height="88" rx="9"/><text x="46" y="120">送信前</text><text x="35" y="148">ファイル作成</text><rect class="b" x="192" y="86" width="158" height="88" rx="9"/><text x="215" y="120">転送済み</text><text x="218" y="148">通信の成功</text><rect class="b" x="372" y="86" width="158" height="88" rx="9"/><text x="400" y="120">受領済み</text><text x="393" y="148">相手先で受信</text><rect class="b" x="552" y="86" width="158" height="88" rx="9"/><text x="581" y="120">取込済み</text><text x="576" y="148">形式・件数検証</text><rect class="b" x="732" y="86" width="158" height="88" rx="9"/><text x="752" y="120">業務反映済み</text><text x="750" y="148">DB・業務確定</text></g><path class="a" d="M170 130H192M350 130H372M530 130H552M710 130H732"/><text x="20" y="217">各境界の状態を個別に記録・照合し、重複再送を防ぐ。</text></svg>