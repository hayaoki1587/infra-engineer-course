<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" role="img" aria-label="日次バッチと外部連携の依存関係"><style>text{font:17px sans-serif;fill:#203047}.t{font-size:22px;font-weight:bold}.b{fill:#e8f2ff;stroke:#3d6e9b;stroke-width:2}.a{stroke:#2578b4;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2578b4"/></marker></defs><text x="20" y="35" class="t">日次処理のジョブネット（架空例）</text><g><rect class="b" x="15" y="83" width="160" height="90" rx="10"/><text x="54" y="117">締め確定</text><text x="43" y="145">CLOSE</text><rect class="b" x="198" y="83" width="160" height="90" rx="10"/><text x="235" y="117">売上集計</text><text x="218" y="145">AGGREGATE</text><rect class="b" x="381" y="83" width="160" height="90" rx="10"/><text x="408" y="117">CSV生成</text><text x="400" y="145">EXPORT</text><rect class="b" x="564" y="83" width="160" height="90" rx="10"/><text x="597" y="117">ファイル転送</text><text x="600" y="145">SEND</text><rect class="b" x="747" y="83" width="160" height="90" rx="10"/><text x="775" y="117">受領確認</text><text x="782" y="145">VERIFY</text></g><path class="a" d="M175 128H198M358 128H381M541 128H564M724 128H747"/><text x="22" y="216">矢印：先行ジョブが正常終了してから次のジョブを起動</text><text x="22" y="250">先行処理の失敗時は後続を保留し、処理済範囲を確認する。</text></svg>