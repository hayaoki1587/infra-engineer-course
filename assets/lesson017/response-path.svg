<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270"><rect width="920" height="270" fill="#f8fafc"/><style>text{font-family:sans-serif;fill:#18334a;font-size:19px}.sm{font-size:15px}</style><rect x="30" y="65" width="150" height="100" rx="12" fill="#e5eef9" stroke="#6685a3"/><text x="105" y="106" text-anchor="middle">利用者</text><text class="sm" x="105" y="138" text-anchor="middle">要求/応答</text><rect x="235" y="65" width="150" height="100" rx="12" fill="#dceafa" stroke="#6685a3"/><text x="310" y="106" text-anchor="middle">Web</text><text class="sm" x="310" y="138" text-anchor="middle">10ms</text><rect x="440" y="65" width="150" height="100" rx="12" fill="#dceafa" stroke="#6685a3"/><text x="515" y="106" text-anchor="middle">AP</text><text class="sm" x="515" y="138" text-anchor="middle">20ms</text><rect x="645" y="65" width="150" height="100" rx="12" fill="#e1f2e4" stroke="#6685a3"/><text x="720" y="106" text-anchor="middle">DB</text><text class="sm" x="720" y="138" text-anchor="middle">180ms</text><path d="M180 98h55m-8 -7l8 7 -8 7" stroke="#397db4" fill="none" stroke-width="3"/><path d="M235 145h-55m8 -7l-8 7 8 7" stroke="#4d9b69" fill="none" stroke-width="3"/><path d="M385 98h55m-8 -7l8 7 -8 7" stroke="#397db4" fill="none" stroke-width="3"/><path d="M440 145h-55m8 -7l-8 7 8 7" stroke="#4d9b69" fill="none" stroke-width="3"/><path d="M590 98h55m-8 -7l8 7 -8 7" stroke="#397db4" fill="none" stroke-width="3"/><path d="M645 145h-55m8 -7l-8 7 8 7" stroke="#4d9b69" fill="none" stroke-width="3"/><text x="460" y="29" text-anchor="middle">Web → AP → DB：処理時間を区間別に測る</text><text x="460" y="208" class="sm" text-anchor="middle">青矢印＝要求、緑矢印＝応答。各時間は架空例</text><text x="460" y="236" class="sm" text-anchor="middle">ネットワーク等の時間も加わるため全体は約230ms</text></svg>