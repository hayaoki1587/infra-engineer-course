<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 265" role="img" aria-label="命令のフェッチ、デコード、実行、結果反映の四段階"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3a729b"/></marker></defs><style>text{font:18px sans-serif;fill:#203247}.small{font-size:15px}.box{fill:#e7f2ff;stroke:#4275a5;stroke-width:2}.arrow{stroke:#3a729b;stroke-width:3;marker-end:url(#a)}</style><rect class="box" x="16" y="50" width="212" height="110" rx="12"/><text x="122" y="87" text-anchor="middle">1 フェッチ</text><text class="small" x="122" y="120" text-anchor="middle">命令を取得</text><rect class="box" x="260" y="50" width="212" height="110" rx="12"/><text x="366" y="87" text-anchor="middle">2 デコード</text><text class="small" x="366" y="120" text-anchor="middle">命令の意味を解読</text><rect class="box" x="504" y="50" width="212" height="110" rx="12"/><text x="610" y="87" text-anchor="middle">3 実行</text><text class="small" x="610" y="120" text-anchor="middle">演算・メモリ参照</text><rect class="box" x="748" y="50" width="212" height="110" rx="12"/><text x="854" y="87" text-anchor="middle">4 結果反映</text><text class="small" x="854" y="120" text-anchor="middle">結果・状態を更新</text><path class="arrow" d="M228 105H260"/><path class="arrow" d="M472 105H504"/><path class="arrow" d="M716 105H748"/><path class="arrow" d="M854 160V207H122V160"/><text class="small" x="488" y="198" text-anchor="middle">次の命令へ（説明用の逐次モデル）</text><text class="small" x="20" y="247">現代CPUはパイプライン・並列実行などにより、内部では複数命令の段階が重なる。</text></svg>