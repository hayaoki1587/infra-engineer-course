<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-label="CPUとRAM、SSD、NICの接続、OSの管理領域を示す論理構成"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3a729b"/></marker></defs><style>text{font:18px sans-serif;fill:#203247}.small{font-size:15px}.node{fill:#e7f2ff;stroke:#4275a5;stroke-width:2}.warm{fill:#fff1dd;stroke:#b18a43;stroke-width:2}.link{stroke:#3a729b;stroke-width:3;marker-end:url(#ar)}</style><rect class="node" x="28" y="92" width="220" height="152" rx="12"/><text x="138" y="122" text-anchor="middle">CPU</text><rect class="warm" x="52" y="139" width="172" height="42" rx="7"/><text x="138" y="165" text-anchor="middle">レジスタ・演算</text><rect class="warm" x="52" y="191" width="172" height="36" rx="7"/><text x="138" y="215" text-anchor="middle">キャッシュ</text><rect class="node" x="358" y="34" width="218" height="98" rx="10"/><text x="467" y="74" text-anchor="middle">主記憶 RAM</text><text class="small" x="467" y="101" text-anchor="middle">実行中の命令・データ</text><rect class="node" x="358" y="213" width="218" height="98" rx="10"/><text x="467" y="253" text-anchor="middle">SSD / HDD</text><text class="small" x="467" y="280" text-anchor="middle">永続データ</text><rect class="node" x="680" y="34" width="218" height="98" rx="10"/><text x="789" y="74" text-anchor="middle">NIC</text><text class="small" x="789" y="101" text-anchor="middle">ネットワークI/O</text><rect class="node" x="680" y="213" width="218" height="98" rx="10"/><text x="789" y="253" text-anchor="middle">ストレージ制御</text><text class="small" x="789" y="280" text-anchor="middle">I/O転送・完了通知</text><path class="link" d="M248 132L358 87"/><path class="link" d="M248 203L358 261"/><path class="link" d="M576 83H680"/><path class="link" d="M576 262H680"/><text class="small" x="25" y="340">矢印＝代表的なデータ・制御の関係。実機の配線や単一バス構造を意味しない。OSが資源を管理する。</text></svg>