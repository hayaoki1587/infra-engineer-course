<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 335" role="img" aria-label="レジスタ、CPUキャッシュ、RAM、SSDの階層と容量・遅延の傾向"><style>text{font:19px sans-serif;fill:#203247}.small{font-size:16px}.layer{stroke:#4878a6;stroke-width:2}</style><path class="layer" fill="#d4e9ff" d="M370 20H550L580 77H340Z"/><text x="460" y="54" text-anchor="middle">レジスタ</text><path class="layer" fill="#e1efff" d="M340 86H580L645 149H275Z"/><text x="460" y="123" text-anchor="middle">CPUキャッシュ</text><path class="layer" fill="#eaf4ff" d="M275 158H645L720 224H200Z"/><text x="460" y="199" text-anchor="middle">主記憶 RAM</text><path class="layer" fill="#fff0dc" d="M200 233H720L815 303H105Z"/><text x="460" y="274" text-anchor="middle">SSD / HDD</text><text class="small" x="15" y="35">小容量</text><text class="small" x="15" y="300">大容量</text><text class="small" x="750" y="35">低遅延の傾向</text><text class="small" x="750" y="322">高遅延の傾向</text><text class="small" x="220" y="329">概念図。容量・速度は製品とアクセス条件で変動する。</text></svg>