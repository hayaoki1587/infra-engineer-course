<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="アプリ、OSキャッシュ、装置、RAM、アプリへの読込み経路"><style>text{font:17px sans-serif;fill:#18324c}.s{font-size:14px}.b{stroke:#55718c;stroke-width:2}</style><rect x="20" y="70" width="140" height="75" rx="10" fill="#dce9f8" class="b"/><text x="90" y="102" text-anchor="middle">アプリ</text><text class="s" x="90" y="125" text-anchor="middle">読込み依頼</text><rect x="220" y="70" width="175" height="75" rx="10" fill="#fff1d9" class="b"/><text x="307" y="100" text-anchor="middle">OS</text><text class="s" x="307" y="125" text-anchor="middle">ページキャッシュ</text><rect x="460" y="70" width="180" height="75" rx="10" fill="#e6f3e4" class="b"/><text x="550" y="100" text-anchor="middle">装置ドライバ</text><text class="s" x="550" y="125" text-anchor="middle">I/O依頼を渡す</text><rect x="700" y="70" width="180" height="75" rx="10" fill="#eee5f8" class="b"/><text x="790" y="100" text-anchor="middle">HDD / SSD</text><text class="s" x="790" y="125" text-anchor="middle">内部で読込み</text><path d="M160 108H220M395 108H460M640 108H700" stroke="#55718c" stroke-width="3"/><path d="M790 145V202H307V145" stroke="#aa7a50" stroke-width="3" fill="none"/><text class="s" x="550" y="191" text-anchor="middle">データはRAMへ転送され、OSがアプリへ返す</text><path d="M307 70V38H90V70" stroke="#55865a" stroke-width="2" stroke-dasharray="5 5" fill="none"/><text class="s" x="198" y="27" text-anchor="middle">キャッシュにあれば装置を省略</text><text class="s" x="450" y="259" text-anchor="middle">概念図。装置・OS・キャッシュ方式によって詳細は異なる。</text></svg>