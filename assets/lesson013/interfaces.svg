<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="HDDやSSDの保存方式とSATA、SAS、PCIe、NVMeの関係"><style>text{font:18px sans-serif;fill:#18324c}.s{font-size:15px}.b{stroke:#55718c;stroke-width:2}</style><text x="18" y="42">保存方式</text><rect x="175" y="15" width="250" height="55" rx="9" fill="#dce9f8" class="b"/><text x="300" y="49" text-anchor="middle">HDD（磁気）</text><rect x="570" y="15" width="250" height="55" rx="9" fill="#dce9f8" class="b"/><text x="695" y="49" text-anchor="middle">SSD（半導体）</text><text x="18" y="155">接続・命令</text><rect x="175" y="110" width="250" height="66" rx="9" fill="#e6f3e4" class="b"/><text x="300" y="138" text-anchor="middle">SATA / SAS</text><text x="300" y="160" text-anchor="middle" class="s">接続規格</text><rect x="570" y="110" width="250" height="66" rx="9" fill="#e6f3e4" class="b"/><text x="695" y="138" text-anchor="middle">NVMe + PCIe</text><text x="695" y="160" text-anchor="middle" class="s">命令方式＋接続経路</text><path d="M300 70V110M695 70V110" stroke="#55718c" stroke-width="3"/><text x="450" y="227" text-anchor="middle">SSDにはSATA接続の製品もある</text><path d="M570 43H495V230H300V176" stroke="#aa7a50" stroke-width="2" stroke-dasharray="6 5" fill="none"/><rect x="90" y="280" width="720" height="70" rx="10" fill="#fff1d9" class="b"/><text x="450" y="310" text-anchor="middle">M.2は主に形状・コネクタの規格</text><text x="450" y="337" text-anchor="middle" class="s">M.2の見た目だけでSATAかNVMeかは決められない</text></svg>