<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230"><rect width="900" height="230" fill="#f8fafc"/><style>text{font-family:sans-serif;font-size:17px;fill:#17334a}.small{font-size:14px}</style><rect x="12" y="65" width="135" height="75" rx="8" fill="#dceafa" stroke="#6985a0"/><text x="79" y="108" text-anchor="middle">警報確認</text><path d="M147 102h13" stroke="#8c785e" stroke-width="3"/><rect x="160" y="65" width="135" height="75" rx="8" fill="#dceafa" stroke="#6985a0"/><text x="227" y="108" text-anchor="middle">業務影響</text><path d="M295 102h13" stroke="#8c785e" stroke-width="3"/><rect x="308" y="65" width="135" height="75" rx="8" fill="#dceafa" stroke="#6985a0"/><text x="375" y="108" text-anchor="middle">残る冗長性</text><path d="M443 102h13" stroke="#8c785e" stroke-width="3"/><rect x="456" y="65" width="135" height="75" rx="8" fill="#e3f1e6" stroke="#6985a0"/><text x="523" y="108" text-anchor="middle">バックアップ</text><path d="M591 102h13" stroke="#8c785e" stroke-width="3"/><rect x="604" y="65" width="135" height="75" rx="8" fill="#e3f1e6" stroke="#6985a0"/><text x="671" y="108" text-anchor="middle">承認・復旧</text><path d="M739 102h13" stroke="#8c785e" stroke-width="3"/><rect x="752" y="65" width="135" height="75" rx="8" fill="#e3f1e6" stroke="#6985a0"/><text x="819" y="108" text-anchor="middle">正常性確認</text><text x="450" y="30" text-anchor="middle">故障検知から復旧検証まで</text><text x="450" y="190" text-anchor="middle" class="small">矢印は調査・判断の順番。安全と業務影響で優先順位を調整</text></svg>