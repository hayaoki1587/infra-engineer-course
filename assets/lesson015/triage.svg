<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310"><style>text{font:17px sans-serif;fill:#17334a}.sub{font-size:14px}</style><rect width="960" height="310" fill="#f7f9fc"/><text x="480" y="30" text-anchor="middle">どの段階まで進んだかで調査対象を絞る</text><rect x="15" y="70" width="178" height="135" rx="9" fill="#e4f2ec" stroke="#6985a0"/><text x="104" y="112" text-anchor="middle">電源・BMC</text><text x="104" y="148" text-anchor="middle" class="sub">PSU / PDU / UPS</text><rect x="205" y="70" width="178" height="135" rx="9" fill="#e9eff7" stroke="#6985a0"/><text x="294" y="112" text-anchor="middle">POST</text><text x="294" y="148" text-anchor="middle" class="sub">メモリ / CPU / ファン</text><rect x="395" y="70" width="178" height="135" rx="9" fill="#e4f2ec" stroke="#6985a0"/><text x="484" y="112" text-anchor="middle">UEFI</text><text x="484" y="148" text-anchor="middle" class="sub">BootOrder / ESP</text><rect x="585" y="70" width="178" height="135" rx="9" fill="#e9eff7" stroke="#6985a0"/><text x="674" y="112" text-anchor="middle">カーネル</text><text x="674" y="148" text-anchor="middle" class="sub">initramfs / ルート</text><rect x="775" y="70" width="178" height="135" rx="9" fill="#e4f2ec" stroke="#6985a0"/><text x="864" y="112" text-anchor="middle">OSサービス</text><text x="864" y="148" text-anchor="middle" class="sub">DB / AP / ネットワーク</text><text x="480" y="256" text-anchor="middle" class="sub">前段が正常でも、後段のOSや業務は停止している場合がある</text></svg>