<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="CPUの順番待ちとストレージやDBの返事待ちの違い"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#3c789c"/></marker></defs><style>text{font:20px sans-serif;fill:#24374a}.small{font-size:16px}.b{fill:#e1efff;stroke:#4878a6;stroke-width:2}.w{fill:#fff1dc;stroke:#b58a40;stroke-width:2}.ar{stroke:#3c789c;stroke-width:3;marker-end:url(#a)}</style><text x="220" y="30" text-anchor="middle">左：CPUの計算順番待ち</text><text x="680" y="30" text-anchor="middle">右：I/OやDBの返事待ち</text><rect class="w" x="28" y="72" width="98" height="65" rx="8"/><text class="small" x="77" y="109" text-anchor="middle">仕事1</text><rect class="w" x="140" y="72" width="98" height="65" rx="8"/><text class="small" x="189" y="109" text-anchor="middle">仕事2</text><rect class="w" x="252" y="72" width="98" height="65" rx="8"/><text class="small" x="301" y="109" text-anchor="middle">仕事3</text><rect class="b" x="144" y="214" width="150" height="72" rx="9"/><text x="219" y="255" text-anchor="middle">CPU</text><path class="ar" d="M220 137V214"/><rect class="w" x="525" y="72" width="150" height="65" rx="8"/><text class="small" x="600" y="110" text-anchor="middle">待機中の仕事</text><rect class="b" x="705" y="214" width="160" height="72" rx="9"/><text class="small" x="785" y="255" text-anchor="middle">DB/ストレージ</text><path class="ar" d="M600 137V248H705"/><text class="small" x="450" y="324" text-anchor="middle">左はCPUを待つ。右は別の装置・処理の完了を待つ。</text></svg>