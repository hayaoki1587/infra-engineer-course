<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="ラック前面から冷気を吸い背面へ熱気を排出する"><style>text{font:19px sans-serif;fill:#1c3550}</style><rect width="900" height="300" fill="#f7f9fc"/><rect x="280" y="55" width="330" height="190" rx="10" fill="#e9eef3" stroke="#607e99" stroke-width="3"/><g fill="#d5e1ec" stroke="#607e99"><rect x="300" y="78" width="290" height="38"/><rect x="300" y="130" width="290" height="38"/><rect x="300" y="182" width="290" height="38"/></g><g text-anchor="middle"><text x="445" y="102">サーバ 1</text><text x="445" y="154">サーバ 2</text><text x="445" y="206">サーバ 3</text><text x="135" y="60">前面：冷気</text><text x="765" y="60">背面：熱気</text></g><g stroke-width="7" fill="none" stroke-linecap="round"><path d="M80 108H265M80 154H265M80 200H265" stroke="#4096c6"/><path d="M625 108H815M625 154H815M625 200H815" stroke="#d47b49"/></g><text x="450" y="280" text-anchor="middle">吸気を妨げず、排気を前面へ戻さない</text></svg>