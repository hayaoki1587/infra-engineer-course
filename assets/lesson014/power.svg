<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-label="商用電源からUPS、PDU、PSUまでA系B系の独立給電"><style>text{font:19px sans-serif;fill:#1c3550}.small{font-size:15px}</style><rect width="960" height="350" fill="#f7f9fc"/><text x="480" y="34" text-anchor="middle">独立した電源A系とB系の例</text><g stroke="#6b8da8" stroke-width="2"><rect x="35" y="70" width="155" height="70" rx="10" fill="#dbeafa"/><rect x="250" y="70" width="155" height="70" rx="10" fill="#dbeafa"/><rect x="465" y="70" width="155" height="70" rx="10" fill="#dbeafa"/><rect x="680" y="70" width="240" height="70" rx="10" fill="#dbeafa"/><rect x="35" y="215" width="155" height="70" rx="10" fill="#e7f2df"/><rect x="250" y="215" width="155" height="70" rx="10" fill="#e7f2df"/><rect x="465" y="215" width="155" height="70" rx="10" fill="#e7f2df"/><rect x="680" y="215" width="240" height="70" rx="10" fill="#e7f2df"/></g><g text-anchor="middle"><text x="112" y="110">商用電源A</text><text x="327" y="110">UPS-A</text><text x="542" y="110">PDU-A</text><text x="800" y="110">サーバ PSU-A</text><text x="112" y="255">商用電源B</text><text x="327" y="255">UPS-B</text><text x="542" y="255">PDU-B</text><text x="800" y="255">サーバ PSU-B</text></g><g stroke="#bc7852" stroke-width="4"><path d="M190 105H250M405 105H465M620 105H680M190 250H250M405 250H465M620 250H680"/></g><text x="480" y="328" text-anchor="middle" class="small">実際の独立性は上流分電盤・受電設備まで確認する</text></svg>