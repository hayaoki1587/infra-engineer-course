<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" role="img" aria-label="スケールアップとスケールアウト"><style>text{font:18px sans-serif;fill:#203247}.t{font-size:24px;font-weight:bold}.b{fill:#e8f3ff;stroke:#487ca8;stroke-width:2}.a{stroke:#2678b7;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2678b7"/></marker></defs><text x="20" y="35" class="t">拡張性：能力の増やし方</text><text x="35" y="75">スケールアップ（1台を強化）</text><rect class="b" x="35" y="105" width="120" height="75" rx="9"/><text x="62" y="150">4 CPU</text><path class="a" d="M160 143H220"/><rect class="b" x="225" y="100" width="160" height="90" rx="9"/><text x="258" y="152">16 CPU</text><text x="500" y="75">スケールアウト（台数追加）</text><rect class="b" x="505" y="105" width="100" height="75" rx="9"/><text x="529" y="149">AP1</text><path class="a" d="M610 143H655"/><rect class="b" x="660" y="95" width="100" height="65" rx="9"/><text x="684" y="135">AP1</text><rect class="b" x="775" y="95" width="100" height="65" rx="9"/><text x="799" y="135">AP2</text><text x="35" y="232" style="font-size:15px">左：機器上限に注意。右：LB、状態管理、DBボトルネックに注意。</text></svg>