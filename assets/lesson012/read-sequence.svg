<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" role="img" aria-label="ファイル読込み依頼、OS、SSD、DMA、完了通知、アプリ再開の順序"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#456f97"/></marker></defs><style>text{font:18px sans-serif;fill:#1b334c}.s{font-size:15px}.line{stroke:#456f97;stroke-width:2;stroke-dasharray:6 5}.arrow{stroke:#456f97;stroke-width:2;marker-end:url(#a)}</style><text x="140" y="40" text-anchor="middle">アプリ</text><text x="390" y="40" text-anchor="middle">OS</text><text x="650" y="40" text-anchor="middle">SSD</text><text x="855" y="40" text-anchor="middle">RAM</text><path class="line" d="M140 55V475M390 55V475M650 55V475M855 55V475"/><path class="arrow" d="M140 100H390"/><text class="s" x="265" y="90" text-anchor="middle">① 読込み依頼</text><path class="arrow" d="M390 180H650"/><text class="s" x="520" y="168" text-anchor="middle">② キャッシュになければ装置へ依頼</text><path class="arrow" d="M650 260H855"/><text class="s" x="750" y="245" text-anchor="middle">③ DMAでRAMへ転送</text><path class="arrow" d="M650 345H390"/><text class="s" x="520" y="333" text-anchor="middle">④ 完了通知（割り込み等）</text><path class="arrow" d="M390 420H140"/><text class="s" x="265" y="407" text-anchor="middle">⑤ アプリへ結果</text><text class="s" x="475" y="502" text-anchor="middle">典型例を単純化。装置やOSによって実際の順序・通知方式は異なる。</text></svg>