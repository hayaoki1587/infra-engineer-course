<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 410" role="img" aria-label="CPUとRAM、PCIeで接続されたSSDとNICの構成例"><style>text{font:21px sans-serif;fill:#1b334c}.s{font-size:16px}.b{stroke:#456f97;stroke-width:2}</style><rect class="b" x="300" y="30" width="250" height="80" rx="10" fill="#d6eaff"/><text x="425" y="78" text-anchor="middle">CPU</text><rect class="b" x="620" y="30" width="190" height="80" rx="10" fill="#fff0d7"/><text x="715" y="78" text-anchor="middle">RAM</text><path d="M550 70H620" stroke="#456f97" stroke-width="4"/><text class="s" x="585" y="58" text-anchor="middle">メモリ経路</text><rect class="b" x="300" y="165" width="250" height="65" rx="10" fill="#eee5ff"/><text x="425" y="205" text-anchor="middle">PCIe接続</text><path d="M425 110V165" stroke="#456f97" stroke-width="4"/><path d="M425 230V270H210V295M425 270H640V295" stroke="#456f97" stroke-width="4" fill="none"/><rect class="b" x="90" y="295" width="240" height="70" rx="10" fill="#e5f2e5"/><rect class="b" x="520" y="295" width="240" height="70" rx="10" fill="#e5f2e5"/><text x="210" y="336" text-anchor="middle">SSD（保存）</text><text x="640" y="336" text-anchor="middle">NIC（通信）</text><text class="s" x="425" y="398" text-anchor="middle">概念図：実際の接続経路は機種や構成で異なる</text></svg>