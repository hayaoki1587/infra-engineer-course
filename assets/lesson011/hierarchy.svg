<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" role="img" aria-label="レジスタ、CPUキャッシュ、RAM、SSDの速度と容量の階層"><style>text{font:22px sans-serif;fill:#1b334c}.s{font-size:17px}.b{stroke:#406c94;stroke-width:2}</style><text x="425" y="30" text-anchor="middle">上ほど一般に高速・小容量、下ほど大容量</text><rect class="b" x="320" y="58" width="210" height="65" rx="10" fill="#cce6ff"/><text x="425" y="98" text-anchor="middle">レジスタ</text><path d="M425 123V151" stroke="#406c94" stroke-width="3"/><rect class="b" x="250" y="151" width="350" height="65" rx="10" fill="#d8edff"/><text x="425" y="191" text-anchor="middle">L1・L2・L3キャッシュ</text><path d="M425 216V244" stroke="#406c94" stroke-width="3"/><rect class="b" x="175" y="244" width="500" height="65" rx="10" fill="#fff0d7"/><text x="425" y="284" text-anchor="middle">RAM（主記憶）</text><path d="M425 309V337" stroke="#406c94" stroke-width="3"/><rect class="b" x="90" y="337" width="670" height="65" rx="10" fill="#e5f2e5"/><text x="425" y="377" text-anchor="middle">SSD（長期保存）</text><text class="s" x="425" y="430" text-anchor="middle">図は一般的な傾向。速度・容量・階層は製品による。</text></svg>