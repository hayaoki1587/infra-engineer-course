<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="アプリのRAM利用、RAM不足時の退避、必要時の読み戻し"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#416c94"/></marker></defs><style>text{font:20px sans-serif;fill:#1b334c}.s{font-size:16px}.b{stroke:#406c94;stroke-width:2}.l{stroke:#416c94;stroke-width:3;fill:none;marker-end:url(#ar)}</style><rect class="b" x="15" y="80" width="230" height="120" rx="12" fill="#d8edff"/><text x="130" y="125" text-anchor="middle">① アプリ</text><text class="s" x="130" y="160" text-anchor="middle">データを使う</text><rect class="b" x="350" y="80" width="230" height="120" rx="12" fill="#fff0d7"/><text x="465" y="125" text-anchor="middle">② RAM</text><text class="s" x="465" y="160" text-anchor="middle">空きが少なくなる</text><rect class="b" x="685" y="80" width="220" height="120" rx="12" fill="#e4f2e5"/><text x="795" y="125" text-anchor="middle">③ ディスク</text><text class="s" x="795" y="160" text-anchor="middle">スワップ退避先</text><path class="l" d="M245 140H350"/><path class="l" d="M580 113H685"/><path class="l" d="M685 174H580"/><text class="s" x="632" y="102" text-anchor="middle">swap-out</text><text class="s" x="632" y="199" text-anchor="middle">swap-in</text><text class="s" x="460" y="267" text-anchor="middle">退避したデータが必要になると読み戻すため、待ち時間が増えることがある</text><text class="s" x="460" y="305" text-anchor="middle">キャッシュ回収などで済む場合もあり、常にスワップが発生するわけではない</text></svg>