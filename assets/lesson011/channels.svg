<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" role="img" aria-label="CPU内のメモリコントローラが二つのチャネルでDIMMと接続"><style>text{font:22px sans-serif;fill:#1b334c}.s{font-size:18px}.b{stroke:#406c94;stroke-width:2}</style><rect class="b" x="280" y="20" width="290" height="115" rx="12" fill="#d7eafa"/><text x="425" y="55" text-anchor="middle">CPU</text><rect class="b" x="315" y="70" width="220" height="47" rx="8" fill="#fff0d7"/><text class="s" x="425" y="99" text-anchor="middle">メモリコントローラ</text><path d="M360 135V180H185V222M490 135V180H665V222" stroke="#406c94" stroke-width="4" fill="none"/><text class="s" x="185" y="207" text-anchor="middle">チャネルA</text><text class="s" x="665" y="207" text-anchor="middle">チャネルB</text><rect class="b" x="65" y="225" width="240" height="75" rx="9" fill="#e5f2e5"/><rect class="b" x="545" y="225" width="240" height="75" rx="9" fill="#e5f2e5"/><text x="185" y="268" text-anchor="middle">DIMM A</text><text x="665" y="268" text-anchor="middle">DIMM B</text><text class="s" x="425" y="338" text-anchor="middle">接続例。実際のチャネル数・DIMM配置は機器仕様に従う。</text></svg>