<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="企業情報システムの論理構成"><style>text{font-family:sans-serif;fill:#17212f}.head{font-size:21px;font-weight:bold}.small{font-size:15px}.box{fill:#edf4ff;stroke:#5177a5;stroke-width:2}.support{fill:#edf9f2;stroke:#54856a;stroke-width:2}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#334155"/></marker></defs><text x="26" y="38" class="head">企業情報システム：主処理経路と共通基盤</text><g><rect class="box" x="24" y="92" width="132" height="78" rx="12"/><text x="48" y="125">利用者端末</text><text class="small" x="54" y="149">ブラウザ</text><rect class="box" x="202" y="92" width="132" height="78" rx="12"/><text x="232" y="125">FW / LB</text><text class="small" x="226" y="149">通信制御</text><rect class="box" x="380" y="92" width="132" height="78" rx="12"/><text x="408" y="125">Web層</text><text class="small" x="406" y="149">HTTP受付</text><rect class="box" x="558" y="92" width="132" height="78" rx="12"/><text x="590" y="125">AP層</text><text class="small" x="581" y="149">業務処理</text><rect class="box" x="736" y="92" width="194" height="78" rx="12"/><text x="802" y="125">DB層</text><text class="small" x="771" y="149">データ・ストレージ</text><path class="arrow" d="M156 131 H202"/><path class="arrow" d="M334 131 H380"/><path class="arrow" d="M512 131 H558"/><path class="arrow" d="M690 131 H736"/></g><text x="30" y="217" class="head">共通サービス・運用系（各層を支える）</text><g><rect class="support" x="24" y="246" width="170" height="74" rx="10"/><text x="81" y="276">DNS</text><text class="small" x="51" y="301">名前解決</text><rect class="support" x="210" y="246" width="170" height="74" rx="10"/><text x="263" y="276">認証</text><text class="small" x="238" y="301">ID・権限</text><rect class="support" x="396" y="246" width="170" height="74" rx="10"/><text x="449" y="276">監視</text><text class="small" x="425" y="301">ログ・通知</text><rect class="support" x="582" y="246" width="170" height="74" rx="10"/><text x="626" y="276">ジョブ</text><text class="small" x="610" y="301">定期処理</text><rect class="support" x="768" y="246" width="170" height="74" rx="10"/><text x="807" y="276">バックアップ</text><text class="small" x="794" y="301">世代・復元</text></g><text x="26" y="379" class="small">上段：注文などの同期的な主処理経路（矢印は要求方向。応答は逆方向）</text><text x="26" y="408" class="small">下段：複数のコンポーネントに依存される共通機能。接続関係は用途により異なる。</text><text x="26" y="438" class="small">論理構成の例であり、物理ホスト数・製品配置を示すものではない。</text></svg>